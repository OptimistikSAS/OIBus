# Require Basic auth for all proxied requests. Loaded via squid.conf's
# `include /etc/squid/conf.d/*.conf`, evaluated before the default `http_access deny all`.
auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/passwords
auth_param basic realm OIBus Squid Proxy
auth_param basic credentialsttl 2 hours

acl authenticated proxy_auth REQUIRED
http_access allow authenticated
