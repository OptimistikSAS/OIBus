<div class="modal-header">
  <h4 class="modal-title" translate="engine.web-server-settings.title"></h4>
</div>
<div class="modal-body">
  <form id="engine-web-server-form" [formGroup]="form" (ngSubmit)="save()">
    <div class="form-group">
      <label class="form-label" for="port" translate="engine.general-settings.port"></label>
      <input formControlName="port" type="number" id="port" class="form-control" />
      <val-errors controlName="port" />
    </div>
    <div class="form-group">
      <label class="form-label" for="auth-token-duration" translate="engine.web-server-settings.auth-token-duration"></label>
      <select class="form-select" id="auth-token-duration" formControlName="authTokenDuration">
        @for (option of authTokenDurationOptions; track option.value) {
          <option [ngValue]="option.value" [translate]="option.labelKey"></option>
        }
      </select>
      <val-errors controlName="authTokenDuration" />
    </div>
    <div class="form-group">
      <div class="form-check form-switch padded">
        <input formControlName="httpsEnabled" id="https-enabled" type="checkbox" class="form-check-input" />
        <label class="form-check-label" for="https-enabled" translate="engine.web-server-settings.https-enabled"></label>
      </div>
    </div>
    @if (httpsEnabled()) {
      <div class="form-group">
        <label class="form-label" for="certificate-source" translate="engine.web-server-settings.certificate-source"></label>
        <select class="form-select" id="certificate-source" formControlName="certificateSource">
          @for (option of certificateSourceOptions; track option.value) {
            <option [ngValue]="option.value" [translate]="option.labelKey"></option>
          }
        </select>
      </div>
      @if (certificateSource() === 'store') {
        <div class="form-group">
          <label class="form-label" for="certificate-id" translate="engine.web-server-settings.certificate"></label>
          <select class="form-select" id="certificate-id" formControlName="certificateId">
            @for (certificate of certificates(); track certificate.id) {
              <option [ngValue]="certificate.id">{{ certificate.name }}</option>
            }
          </select>
          <val-errors controlName="certificateId" />
          @if (certificates().length === 0) {
            <div class="form-text" translate="engine.web-server-settings.no-certificate"></div>
          }
        </div>
      } @else {
        <div class="form-group">
          <label class="form-label" for="certificate-path" translate="engine.web-server-settings.certificate-path"></label>
          <input formControlName="certificatePath" id="certificate-path" class="form-control" />
          <val-errors controlName="certificatePath" />
        </div>
        <div class="form-group">
          <label class="form-label" for="private-key-path" translate="engine.web-server-settings.private-key-path"></label>
          <input formControlName="privateKeyPath" id="private-key-path" class="form-control" />
          <val-errors controlName="privateKeyPath" />
          <div class="form-text" translate="engine.web-server-settings.file-hint"></div>
        </div>
      }
    }
  </form>
</div>
<div class="modal-footer">
  <div class="btn-group">
    <button
      type="submit"
      form="engine-web-server-form"
      class="btn btn-primary"
      translate="common.save"
      id="save-web-server-button"
    ></button>
    <button type="button" class="btn btn-cancel" (click)="cancel()" translate="common.cancel" id="cancel-web-server-button"></button>
  </div>
</div>
