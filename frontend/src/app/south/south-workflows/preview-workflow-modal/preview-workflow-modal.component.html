<div class="modal-header">
  <h4 class="modal-title" [translate]="'south.workflows.run-payload-title'" [translateParams]="{ name: workflowName() }"></h4>
</div>
<div class="modal-body">
  @if (result(); as result) {
    <oib-workflow-preview [result]="result" context="run-payload" [workflowName]="workflowName()" />
  } @else {
    <div class="text-center">
      <oib-loading-spinner />
      <div translate="south.workflows.preview-loading"></div>
    </div>
  }
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-primary" (click)="close()" translate="common.close" id="close-button"></button>
</div>
