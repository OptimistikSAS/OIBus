<p class="text-muted" translate="history-query.modal.create-details"></p>
<div class="row g-4">
  <oib-connector-choice
    class="col-md-6"
    id="south-connector"
    side="south"
    titleKey="common.connector-choice.south"
    [form]="createForm.controls.south"
    [existing]="connectors()?.southList ?? []"
    [types]="connectors()?.southTypes ?? []"
  />
  <oib-connector-choice
    class="col-md-6"
    id="north-connector"
    side="north"
    titleKey="common.connector-choice.north"
    [form]="createForm.controls.north"
    [existing]="connectors()?.northList ?? []"
    [types]="connectors()?.northTypes ?? []"
  />
</div>
