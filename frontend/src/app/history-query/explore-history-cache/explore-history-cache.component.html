@if (historyQuery(); as historyQuery) {
  <div class="oib-padded-container">
    <div class="row justify-content-center">
      <div class="col-md-10 col-lg-8">
        <div class="oib-page-header">
          <div>
            <h1 id="title" translate="explore-cache.title" [translateParams]="{ name: historyQuery.name }"></h1>
            <div class="oib-page-meta">
              <span class="oib-status-badge" id="history-query-status">
                <span [class]="statusIcon(historyQuery.status)" aria-hidden="true"></span>
                <span [translate]="'enums.status.' + historyQuery.status"></span>
              </span>
              <span class="d-flex align-items-center gap-1" id="history-query-connectors">
                {{ historyQuery.southType | oIBusSouthTypeEnum }}
                <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
                {{ historyQuery.northType | oIBusNorthTypeEnum }}
              </span>
            </div>
          </div>
        </div>

        <section class="oib-panel">
          <div class="oib-section-title">
            <h5 translate="common.search"></h5>
          </div>
          <form [formGroup]="form" (ngSubmit)="submit()" id="cache-form">
            <div class="row g-3">
              <div class="col-lg-6">
                <label for="start-date" class="form-label" translate="explore-cache.search.start"></label>
                <oib-datetimepicker formControlName="start" id="start-date" />
              </div>
              <div class="col-lg-6">
                <label for="end-date" class="form-label" translate="explore-cache.search.end"></label>
                <oib-datetimepicker formControlName="end" id="end-date" />
                <val-errors [control]="form" />
              </div>
              <div class="col-lg-6">
                <label for="filename-contains" class="form-label" translate="explore-cache.search.filename-contains"></label>
                <input type="text" class="form-control" id="filename-contains" formControlName="nameContains" />
              </div>
              <div class="col-lg-6">
                <label
                  for="max-number-of-files-returned"
                  class="form-label"
                  translate="explore-cache.search.max-number-of-files-returned"
                ></label>
                <input type="number" class="form-control" id="max-number-of-files-returned" formControlName="maxNumberOfFilesReturned" />
              </div>
            </div>
            <div class="d-flex justify-content-end mt-3">
              <button
                type="submit"
                [oib-save-button]="state"
                class="btn btn-primary"
                id="search-button"
                iconClass="fa-search"
                translationKey="common.search"
              ></button>
            </div>
          </form>
        </section>

        @if (cacheContent(); as cacheContent) {
          <oib-cache-explore
            [cacheContent]="cacheContent"
            [entity]="{ id: historyQuery.id, type: 'history' }"
            [state]="state"
            (updateCommand)="updateCacheContent($event)"
            (viewCommand)="viewCacheContent($event)"
          />
        }
      </div>
    </div>
  </div>
}
