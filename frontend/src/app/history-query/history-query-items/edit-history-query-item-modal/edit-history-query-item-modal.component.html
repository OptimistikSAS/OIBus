<div class="modal-header">
  <h4 class="modal-title" [translate]="'south.edit-item-modal.' + mode() + '-title'"></h4>
</div>
<oib-modal-steps
  [steps]="steps.steps"
  [(current)]="steps.current"
  [invalidSteps]="steps.invalid()"
  labelPrefix="south.edit-item-modal.step."
  ariaLabel="south.edit-item-modal.steps"
/>
@if (form(); as form) {
  <div class="modal-body">
    <form [formGroup]="form" (ngSubmit)="submit()" id="form">
      <!-- 1. General: what every item has, whatever its connector -->
      <div [hidden]="steps.current() !== 'general'" id="step-general">
        <h5 class="oib-section-title" translate="south.edit-item-modal.step.general"></h5>
        <div class="row">
          <!-- Name -->
          <div class="col-md-6">
            <div class="form-group">
              <label class="form-label" for="name" translate="south.items.name"></label>
              <input formControlName="name" id="name" class="form-control" />
              <val-errors controlName="name" />
            </div>
          </div>
        </div>
        <!-- Enabled -->
        <div class="form-group">
          <div class="form-check form-switch">
            <input formControlName="enabled" id="item-enabled" type="checkbox" class="form-check-input" />
            <label class="form-check-label" for="item-enabled" translate="south.items.enable"></label>
          </div>
        </div>
      </div>

      <!-- 2. Settings: those of the connector type -->
      <div [hidden]="steps.current() !== 'settings'" id="step-settings">
        <h5 class="oib-section-title" [translate]="itemSettingsAttribute()!.translationKey"></h5>
        <ng-container formGroupName="settings">
          <oib-oibus-object-form-control
            [scanModes]="[]"
            [certificates]="[]"
            [group]="form.controls.settings"
            [objectAttribute]="itemSettingsAttribute()!"
          />
        </ng-container>
      </div>
    </form>

    <!-- 2. Settings, tried out right away: the test panel has its own form, so it sits outside the item one -->
    <div [hidden]="steps.current() !== 'settings'" class="mt-4" id="step-settings-test">
      <oib-south-item-test
        type="history-south"
        [entityId]="historyId()"
        [fromSouth]="fromSouth()"
        [item]="formItem()!"
        [connectorCommand]="southConnectorCommand()!"
        [manifest]="manifest()!"
        [inMemoryTransformers]="inMemoryTransformers()"
      />
    </div>

    <!-- 3. Review & save: the item as it will be saved -->
    <div [hidden]="steps.current() !== 'review'" id="step-review">
      @let item = formItem()!;
      <h5 class="oib-section-title" translate="south.edit-item-modal.step.general"></h5>
      <dl class="oib-summary" id="item-summary">
        <div>
          <dt translate="south.items.name"></dt>
          <dd>{{ item.name }}</dd>
        </div>
        <div>
          <dt translate="south.items.status"></dt>
          <dd [translate]="item.enabled ? 'common.enabled' : 'common.disabled'"></dd>
        </div>
      </dl>
      <h5 class="oib-section-title" [translate]="itemSettingsAttribute()!.translationKey"></h5>
      <oib-oibus-settings-summary id="settings-summary" [objectAttribute]="itemSettingsAttribute()!" [value]="item.settings" />
    </div>
  </div>
}
<div class="modal-footer">
  <!-- Moving between the steps, apart from saving: the main action is Save once it shows, Next before -->
  <div class="btn-group me-auto">
    @if (!steps.isFirst()) {
      <button type="button" class="btn btn-secondary" id="previous-step" (click)="steps.back()" translate="common.back"></button>
    }
    @if (!steps.isLast()) {
      <button
        type="button"
        class="btn"
        [class.btn-primary]="!canSave()"
        [class.btn-secondary]="canSave()"
        id="next-step"
        (click)="steps.next()"
        translate="common.next"
      ></button>
    }
  </div>
  <div class="btn-group">
    <!-- Adding many items in a row -->
    @if (mode() === 'create' && canSave()) {
      <button type="button" class="btn btn-secondary" id="save-and-add-another" (click)="save(true)">
        <i class="fa-solid fa-plus me-1" aria-hidden="true"></i>
        <span [translate]="directSave() ? 'south.edit-item-modal.save-and-add-another' : 'south.edit-item-modal.ok-and-add-another'"></span>
      </button>
    }
    @if (canSave()) {
      <button
        type="submit"
        [oib-save-button]="state"
        form="form"
        [translationKey]="directSave() ? 'common.save' : 'common.ok'"
        [iconClass]="directSave() ? 'fa-floppy-disk' : 'fa-check'"
      ></button>
    }
    <button type="button" class="btn btn-cancel" (click)="cancel()" translate="common.cancel" id="cancel-button"></button>
  </div>
</div>
