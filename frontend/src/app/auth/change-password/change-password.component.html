<div class="oib-padded-container">
  <div class="row">
    <div class="col-xs-12 col-sm-8 offset-sm-2 col-md-6 offset-md-3 col-lg-4 offset-lg-4">
      <div class="oib-inner-form bg-light p-5">
        <img src="/oibus_white.svg" alt="" class="img-fluid mb-5" />
        <h1 class="h4 mb-3" translate="user-settings.change-password.title"></h1>
        <div class="alert alert-warning" translate="user-settings.change-password.change-required"></div>
        <form [formGroup]="form" (ngSubmit)="save()">
          <div [ngbCollapse]="!error()" class="alert alert-danger" role="alert" translate="user-settings.change-password.error"></div>
          <oib-change-password-fields [form]="form" />
          <div class="text-end">
            <div class="btn-group">
              <button type="submit" class="btn btn-primary" translate="common.save" id="change-password-button"></button>
              <button type="button" class="btn btn-cancel" (click)="logout()" translate="nav.account.logout" id="logout-button"></button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
