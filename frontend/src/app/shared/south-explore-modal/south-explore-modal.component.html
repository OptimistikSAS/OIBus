<div class="modal-header">
  <h4 class="modal-title" translate="south.explore.title"></h4>
</div>
<div class="modal-body">
  <oib-explore-tree />
</div>
<div class="modal-footer">
  @if (checkedActions().length > 0) {
    <span
      class="me-auto text-muted"
      id="explore-checked-count"
      [translate]="'south.explore.checked-count'"
      [translateParams]="{ count: checkedCount() }"
    ></span>
    @for (action of checkedActions(); track action.id) {
      <button
        type="button"
        class="btn explore-checked-action"
        [class.btn-primary]="$last"
        [class.btn-secondary]="!$last"
        [disabled]="checkedCount() === 0"
        (click)="runCheckedAction(action)"
        [translate]="action.labelKey"
      ></button>
    }
  }
  <div class="btn-group">
    <button type="button" class="btn btn-cancel" (click)="cancel()" translate="common.close" id="cancel-button"></button>
  </div>
</div>
