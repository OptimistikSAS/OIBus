<div class="transformer-pipeline">
  <!-- Which panes are shown: both side by side, or one of them on the full width; the actions given by the parent on the far right -->
  @if (hasTransformer()) {
    <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
      <div
        class="d-flex flex-wrap align-items-center gap-1"
        role="group"
        [attr.aria-label]="'south.test-item.pipeline.show' | translate"
        id="pipeline-panes"
      >
        <span class="small text-body-secondary me-1" translate="south.test-item.pipeline.show"></span>
        @for (choice of paneChoices; track choice) {
          <button
            type="button"
            class="filter-chip px-2 py-1"
            [class.active]="panes() === choice"
            [attr.aria-pressed]="panes() === choice"
            (click)="panes.set(choice)"
            [translate]="'south.test-item.pipeline.' + choice"
          ></button>
        }
      </div>
      <div class="ms-auto">
        <ng-content select="[pipelineActions]" />
      </div>
    </div>
  }
  <!-- flex + gap, not the Bootstrap grid: a .row's negative margins would bleed this wider than
       the plain-block .pipeline-transformer box above it, misaligning their borders. -->
  <div class="d-flex flex-column flex-md-row gap-3">
    <!-- Raw result -->
    <div class="pipeline-stage" [class.d-none]="hasTransformer() && panes() === 'output'">
      <div class="d-flex justify-content-between align-items-center pipeline-caption">
        <span translate="south.test-item.pipeline.raw"></span>
        @if (rawMode(); as rawMode) {
          <div ngbDropdown class="d-inline-block">
            <button type="button" class="btn btn-sm btn-link text-secondary p-0" ngbDropdownToggle>
              <span class="fa-solid {{ rawView.currentDisplayModeIcon }}" aria-hidden="true"></span>
              <span class="ms-1">{{ 'south.test-item.view.' + rawMode | translate }}</span>
            </button>
            <div ngbDropdownMenu>
              @for (mode of rawModes(); track $index) {
                <button type="button" ngbDropdownItem [class.active]="rawMode === mode" (click)="changeRawMode(mode)">
                  <span class="fa-solid {{ rawView.displayModeIcons[mode] }}" aria-hidden="true"></span>
                  <span class="ms-1">{{ 'south.test-item.view.' + mode | translate }}</span>
                </button>
              }
            </div>
          </div>
        }
      </div>
      <oib-item-test-result
        #rawView
        [compact]="true"
        (availableDisplayModes)="rawModes.set($event)"
        (currentDisplayMode)="rawMode.set($event)"
      />
    </div>

    @if (hasTransformer()) {
      <!-- Transformer output -->
      <div class="pipeline-stage pipeline-stage-output" [class.d-none]="panes() === 'raw'">
        <div class="d-flex justify-content-between align-items-center pipeline-caption">
          <span translate="south.test-item.pipeline.output"></span>
          @if (outputMode(); as outputMode) {
            <div ngbDropdown class="d-inline-block">
              <button type="button" class="btn btn-sm btn-link text-secondary p-0" ngbDropdownToggle>
                <span class="fa-solid {{ outputView.currentDisplayModeIcon }}" aria-hidden="true"></span>
                <span class="ms-1">{{ 'south.test-item.view.' + outputMode | translate }}</span>
              </button>
              <div ngbDropdownMenu>
                @for (mode of outputModes(); track $index) {
                  <button type="button" ngbDropdownItem [class.active]="outputMode === mode" (click)="changeOutputMode(mode)">
                    <span class="fa-solid {{ outputView.displayModeIcons[mode] }}" aria-hidden="true"></span>
                    <span class="ms-1">{{ 'south.test-item.view.' + mode | translate }}</span>
                  </button>
                }
              </div>
            </div>
          }
        </div>
        <oib-item-test-result
          #outputView
          [compact]="true"
          (availableDisplayModes)="outputModes.set($event)"
          (currentDisplayMode)="outputMode.set($event)"
        />
      </div>
    }
  </div>
</div>
