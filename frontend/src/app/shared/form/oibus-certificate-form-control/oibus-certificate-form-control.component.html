<div class="form-group">
  <label [for]="inputId()" class="form-label" [translate]="certificateAttribute().translationKey"></label>
  <oib-select-or-create
    [formControlName]="certificateAttribute().key"
    [inputId]="inputId()"
    [options]="presentedCertificates()"
    noneLabel="engine.certificate.none"
    [creator]="certificateCreator"
  />
  <val-errors [controlName]="certificateAttribute().key" />
</div>
