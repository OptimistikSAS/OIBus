<div class="form-group">
  <label [for]="scanModeAttribute().key" class="form-label" [translate]="scanModeAttribute().translationKey"></label>
  <oib-select-or-create
    [formControlName]="scanModeAttribute().key"
    [inputId]="scanModeAttribute().key"
    [options]="scanModes()"
    bindValue="option"
    noneLabel="engine.scan-mode.none"
    [creator]="scanModeCreator()"
  />
  <val-errors [controlName]="scanModeAttribute().key" />
</div>
