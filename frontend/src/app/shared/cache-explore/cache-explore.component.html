<p class="snapshot-date" id="snapshot-date">
  <i class="fa-regular fa-clock me-1" aria-hidden="true"></i>
  <span translate="explore-cache.snapshot-warning" [translateParams]="{ snapshotDate: cacheContent().searchDate | datetime: 'FF' }"></span>
</p>

@if (isDirty()) {
  <!-- stays in sight while scrolling through the folders, until the changes are saved or discarded -->
  <div class="unsaved-changes" id="unsaved-changes" role="status">
    <span>
      <i class="fa-solid fa-circle-exclamation me-2" aria-hidden="true"></i>
      <span translate="explore-cache.unsaved-changes"></span>
    </span>
    <div class="d-flex gap-2">
      <button type="button" class="btn btn-subtle btn-sm" (click)="discardModifications()" [disabled]="isPending()">
        <span aria-hidden="true" class="fa-solid fa-rotate-left me-1"></span>
        <span translate="explore-cache.discard-changes"></span>
      </button>
      <button type="button" class="btn btn-primary btn-sm" (click)="saveModifications()" [disabled]="isPending()">
        @if (isPending()) {
          <span aria-hidden="true" class="fa-solid fa-spinner fa-spin me-1"></span>
        } @else {
          <span aria-hidden="true" class="fa-regular fa-floppy-disk me-1"></span>
        }
        <span translate="explore-cache.save-changes"></span>
      </button>
    </div>
  </div>
}

<oib-cache-content
  id="cache"
  cacheType="cache"
  [cacheContentFiles]="localResult().cache"
  [size]="localResult().metrics.currentCacheSize"
  (operation)="handleOperation($event)"
  [state]="state()"
/>
<oib-cache-content
  id="error"
  cacheType="error"
  [cacheContentFiles]="localResult().error"
  [size]="localResult().metrics.currentErrorSize"
  (operation)="handleOperation($event)"
  [state]="state()"
/>
<oib-cache-content
  id="archive"
  cacheType="archive"
  [cacheContentFiles]="localResult().archive"
  [size]="localResult().metrics.currentArchiveSize"
  (operation)="handleOperation($event)"
  [state]="state()"
/>
